name: Update README stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-stats.yml"
  schedule:
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02
        with:
          username: ${{ github.repository_owner }}
          options: "theme=github-compact&hide_border=true&color=369E6F&point=525252"
          output_path: assets/activity-graph.svg
          token: ${{ github.token }}

      - name: Update README cache date
        shell: bash
        run: |
          today="$(TZ=Australia/Sydney date +%Y%m%d)"
          perl -0pi -e "s/v=\d{8}/v=$today/g" README.md

          if ! grep -q "v=$today" README.md; then
            echo "No README cache-busting parameters were updated." >&2
            exit 1
          fi

      - name: Commit and push README update
        shell: bash
        run: |
          changes="$(git status --porcelain -- README.md assets/activity-graph.svg)"
          if [ -z "$changes" ]; then
            echo "README stats and activity graph are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity-graph.svg
          git commit -m "feat: update stats and graph"
          git push
