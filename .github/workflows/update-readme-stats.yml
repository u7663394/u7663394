name: Update README stats

on:
  schedule:
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README cache date
        shell: bash
        run: |
          today="$(TZ=Australia/Sydney date +%Y%m%d)"
          perl -0pi -e "s/v=\d{8}/v=$today/g" README.md

          if ! grep -q "v=$today" README.md; then
            echo "No README cache-busting parameters were updated." >&2
            exit 1
          fi

      - name: Commit and push README update
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "README.md already uses today's date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "feat: update stats and graph"
          git push
